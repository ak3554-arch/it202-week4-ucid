<!DOCTYPE html>
<html>
<head>
    <title>Simple Password Toggle</title>
</head>
<body>

<h3>Enter Password:</h3>
<input type="password" id="passwordBox">

<script>
    // Get the password input
    var passwordBox = document.getElementById("passwordBox");

    // Toggle visibility and background color on click
    passwordBox.onclick = function() {
        if (passwordBox.type === "password") {
            passwordBox.type = "text";           // Show password
            passwordBox.style.backgroundColor = "lightgreen";
        } else {
            passwordBox.type = "password";       // Hide password
            passwordBox.style.backgroundColor = "lightcoral";
        }
    }
</script>

</body>
</html>
